name: Update Cargo Dependencies

on:
  schedule:
    # Every Monday at 07:00 UTC (before the Renovate npm run)
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.ECOSPARK_APP_ID }}
          private-key: ${{ secrets.ECOSPARK_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo update
        working-directory: packages/groq-wasm/rust
        run: cargo update 2>&1

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet packages/groq-wasm/rust/Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize updates
        if: steps.changes.outputs.changed == 'true'
        id: summary
        working-directory: packages/groq-wasm/rust
        run: |
          {
            echo 'summary<<EOF'
            git diff Cargo.lock | grep '^[+-]' | grep -E '(name|version|source)' | head -50
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Without a changeset, merging the PR never triggers a release of groq-wasm.
      - name: Add changeset
        if: steps.changes.outputs.changed == 'true'
        run: |
          file=".changeset/groq-wasm-cargo-update-${{ github.run_id }}.md"
          {
            echo '---'
            echo "'@sanity-labs/groq-wasm': patch"
            echo '---'
            echo
            echo 'Update Rust dependencies in `Cargo.lock`:'
            echo
            git diff -U5 packages/groq-wasm/rust/Cargo.lock | awk '
              /^[ +-]name = / { name = $3; gsub(/"/, "", name) }
              /^-version = / { old = $3; gsub(/"/, "", old) }
              /^\+version = / { new = $3; gsub(/"/, "", new); print "- `" name "` " (old == "" ? new " (added)" : old " -> " new); old = "" }
              /^-source = "git\+/ { split($3, a, "#"); oldrev = substr(a[2], 1, 7) }
              /^\+source = "git\+/ { split($3, a, "#"); print "- `" name "` (git) " oldrev " -> " substr(a[2], 1, 7) }
            '
          } > "$file"
          cat "$file"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: chore/update-cargo-deps
          add-paths: |
            packages/groq-wasm/rust/Cargo.lock
            .changeset/*.md
          commit-message: 'chore(groq-wasm): update cargo dependencies'
          title: 'chore(groq-wasm): update cargo dependencies'
          body: |
            Automated weekly update of Cargo dependencies for `groq-wasm`.

            This updates the `Cargo.lock` to pull in the latest compatible versions of all
            Rust dependencies, including the `groq-lint` and `groq-format` git dependencies.
            A patch changeset for `@sanity-labs/groq-wasm` is included so merging this PR
            queues a release.

            ```diff
            ${{ steps.summary.outputs.summary }}
            ```
          labels: dependencies,rust
          delete-branch: true
