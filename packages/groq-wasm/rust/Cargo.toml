[package]
name = "groq-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for GROQ linting and formatting"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# GROQ tools from atombender
groq-lint = { git = "https://github.com/atombender/groq-lint.git" }
# Fork pin for the bracket-attribute fix (atombender/groq-format#3).
# Switch back to atombender/groq-format once that PR merges.
groq-format = { git = "https://github.com/stipsan/groq-format.git", rev = "e7e795bc0042492914d8172ff3a83af24a7eff28" }
# Direct parser access (`ParseResult::referenced_params`, and structured
# `ParseError`s with UTF-8 byte spans for `validate`). Same git source
# groq-lint and groq-format use, so Cargo resolves a single revision.
groq-parser = { git = "https://github.com/sanity-io/groq-parser-rs.git" }

# WASM bindings
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For better error messages in WASM
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[profile.release]
# Optimize for size
opt-level = "s"
lto = true
